[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "faker>=40.40.0",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlmodel>=0.0.47",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
